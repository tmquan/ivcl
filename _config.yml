# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: Intelligent Visual Computing
author: Tran Minh Quan
logo: gpgpu.png

# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: force
  # research/connectome/isaac_viewer.ipynb runs on an Isaac Sim machine only (kernel
  # "isaac_sim_connectome"). Anywhere else the missing kernel stops the whole build.
  exclude_patterns: ['*isaac_viewer.ipynb']

# Files in the folder that are not pages of the book. The first four are Jupyter Book's own defaults.
# isaac_viewer.ipynb is a working notebook: it is not in _toc.yml and no page links to it.
exclude_patterns: [_build, Thumbs.db, .DS_Store, "**.ipynb_checkpoints", "research/connectome/isaac_viewer.ipynb"]

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - references.bib

# Information about where the book exists on the web
repository:
  url: https://github.com/tmquan/ivcl  # Online location of your book
  path_to_book: docs  # Optional path to your book, relative to the repository root
  branch: master  # Which branch of the repository should be used when creating links (optional)

# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  use_issues_button: true
  use_repository_button: true

google_analytics:
  mytrackingcode: G-B4DLH79M37

# Link-preview tags (Open Graph) for the pages listed in _ext/linkpreview.py
sphinx:
  local_extensions:
    linkpreview: ./_ext
