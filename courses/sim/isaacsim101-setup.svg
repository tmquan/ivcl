<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">A Mac connected to a DGX Spark</title>
  <desc id="d">The editor on the Mac reaches the SSH server of the DGX Spark on TCP port 22. Web pages served on the Spark reach the browser on the Mac through ports forwarded inside that SSH connection. The Isaac Sim WebRTC client on the Mac connects directly to Isaac Sim on TCP port 49100 and UDP port 47998, outside SSH.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="780" height="330" fill="#ffffff"/>

  <!-- Mac -->
  <rect x="20" y="20" width="250" height="290" rx="8" fill="#f6f6f6" stroke="#333333" stroke-width="1.5"/>
  <text x="36" y="46" font-size="16" font-weight="bold" fill="#111111">Mac</text>
  <text x="36" y="64" font-size="11.5" fill="#555555">macOS, Apple silicon</text>

  <rect x="40" y="84" width="210" height="52" rx="6" fill="#ffffff" stroke="#333333"/>
  <text x="52" y="106" font-size="13" font-weight="bold" fill="#111111">Cursor or VS Code</text>
  <text x="52" y="124" font-size="11.5" fill="#555555">editor, terminal, debugger</text>

  <rect x="40" y="158" width="210" height="52" rx="6" fill="#ffffff" stroke="#333333"/>
  <text x="52" y="180" font-size="13" font-weight="bold" fill="#111111">Web browser</text>
  <text x="52" y="198" font-size="11.5" fill="#555555">http://localhost:11000</text>

  <rect x="40" y="232" width="210" height="52" rx="6" fill="#ffffff" stroke="#333333"/>
  <text x="52" y="254" font-size="13" font-weight="bold" fill="#111111">Isaac Sim WebRTC client</text>
  <text x="52" y="272" font-size="11.5" fill="#555555">the simulator's window</text>

  <!-- DGX Spark -->
  <rect x="510" y="20" width="250" height="290" rx="8" fill="#f1f7e4" stroke="#333333" stroke-width="1.5"/>
  <text x="526" y="46" font-size="16" font-weight="bold" fill="#111111">DGX Spark</text>
  <text x="526" y="64" font-size="11.5" fill="#555555">DGX OS 7 (Ubuntu 24.04), aarch64</text>

  <rect x="530" y="84" width="210" height="52" rx="6" fill="#ffffff" stroke="#333333"/>
  <text x="542" y="106" font-size="13" font-weight="bold" fill="#111111">SSH server, port 22</text>
  <text x="542" y="124" font-size="11.5" fill="#555555">editor server, shell, python.sh</text>

  <rect x="530" y="158" width="210" height="52" rx="6" fill="#ffffff" stroke="#333333"/>
  <text x="542" y="180" font-size="13" font-weight="bold" fill="#111111">Web pages on localhost</text>
  <text x="542" y="198" font-size="11.5" fill="#555555">DGX Dashboard, port 11000</text>

  <rect x="530" y="232" width="210" height="52" rx="6" fill="#ffffff" stroke="#333333"/>
  <text x="542" y="254" font-size="13" font-weight="bold" fill="#111111">Isaac Sim, streaming</text>
  <text x="542" y="272" font-size="11.5" fill="#555555">isaac-sim.streaming.sh</text>

  <!-- links -->
  <line x1="254" y1="110" x2="526" y2="110" stroke="#333333" stroke-width="1.8" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="390" y="101" font-size="12" text-anchor="middle" fill="#111111">SSH, TCP 22</text>

  <line x1="254" y1="184" x2="526" y2="184" stroke="#333333" stroke-width="1.2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="390" y="175" font-size="12" text-anchor="middle" fill="#111111">ports forwarded inside SSH (TCP only)</text>

  <line x1="254" y1="258" x2="526" y2="258" stroke="#b03a2e" stroke-width="1.8" stroke-dasharray="7 5" marker-start="url(#b)" marker-end="url(#b)"/>
  <text x="390" y="249" font-size="12" text-anchor="middle" fill="#b03a2e">direct, same network</text>
  <text x="390" y="276" font-size="12" text-anchor="middle" fill="#b03a2e">TCP 49100 + UDP 47998</text>
</svg>
